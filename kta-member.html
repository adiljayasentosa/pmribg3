<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KTA PMR</title><meta name="theme-color" content="#C8102E"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/kta.css"><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script></head><body><main class="kta-member-page"><section id="login-card" class="card kta-login-card"><h1>KTA PMR</h1><p class="page-sub">Masuk untuk melihat KTA milik akun ini.</p><div class="field"><label>Nomor Induk</label><input id="ni" autocomplete="username" placeholder="Contoh: PMR001"></div><div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Password"></div><button id="btn-login" class="btn btn-primary" style="width:100%">Masuk</button><p id="msg" class="kta-msg"></p></section><section id="kta-card" class="card kta-member-card" style="display:none"><div class="kta-member-head"><div><span class="badge badge-red">KTA PMR</span><h1 id="member-name">—</h1><p id="member-meta">—</p></div><button id="btn-logout" class="btn btn-outline btn-sm">Keluar</button></div><div class="kta-member-images"><img id="member-front" src="assets/kta-front-template.png" alt="KTA depan"><img src="assets/kta-back-template.png" alt="KTA belakang"></div></section></main><script src="js/firebase-config.js"></script><script>
const targetToken=new URLSearchParams(location.search).get('kta');const msg=document.getElementById('msg');
function m(t,kind=''){msg.textContent=t;msg.className='kta-msg '+kind}
function email(ni){return String(ni).trim().toLowerCase()+'@pmr-smkibg3.app'}
async function loadOwn(){const u=firebase.auth().currentUser;if(!u)return;const us=await firebase.firestore().collection('users').doc(u.uid).get();if(!us.exists||us.data().role!=='anggota')throw new Error('Akun anggota tidak valid.');const d=us.data();const ktaSnap=await firebase.firestore().collection('kta').doc(d.anggotaId).get();if(!ktaSnap.exists)throw new Error('KTA belum diaktifkan untuk akun ini.');const kta=ktaSnap.data();if(targetToken && kta.ktaToken!==targetToken)throw new Error('QR KTA ini bukan milik akun yang sedang login.');const snap=await firebase.firestore().collection('anggota').doc(d.anggotaId).get();if(!snap.exists)throw new Error('Data anggota tidak ditemukan.');const a=snap.data();if(a.statusKeanggotaan==='Tidak Aktif')throw new Error('KTA ini tidak aktif.');document.getElementById('login-card').style.display='none';document.getElementById('kta-card').style.display='block';document.getElementById('member-name').textContent=a.nama||'Anggota PMR';document.getElementById('member-meta').textContent=[a.nomorInduk,a.kelas,a.jabatan,a.divisi].filter(Boolean).join(' · ');}
firebase.auth().onAuthStateChanged(u=>{if(u)loadOwn().catch(e=>m(e.message,'error'))});document.getElementById('btn-login').onclick=async()=>{m('Memverifikasi…');try{const ni=document.getElementById('ni').value;const pw=document.getElementById('pw').value;await firebase.auth().signInWithEmailAndPassword(email(ni),pw);m('');}catch(e){m(e.code==='auth/invalid-credential'?'Nomor Induk atau password salah.':e.message,'error')}};document.getElementById('btn-logout').onclick=()=>firebase.auth().signOut().then(()=>location.reload());
</script></body></html>
