<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Masuk · PMR WIRA UNIT SMK IBG 3</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#C8102E"/>
  <meta name="description" content="Masuk ke sistem PMR WIRA UNIT SMK IBG 3."/>
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="auth-body">
  <main class="auth-page">
    <section class="auth-form-side" aria-label="Login PMR WIRA UNIT">
      <div class="auth-form-container">
        <a class="auth-mobile-brand" href="index.html" aria-label="Kembali ke halaman utama">
          <img src="assets/logo.svg" alt="Logo PMR WIRA UNIT"/>
          <span><strong>PMR WIRA UNIT</strong><small>SMK IBG 3</small></span>
        </a>

        <div class="auth-heading auth-heading-left">
          <h2>Selamat Datang</h2>
          <p>Silakan masuk ke akun PMR WIRA UNIT untuk melanjutkan.</p>
        </div>

        <div id="login-error" class="alert alert-danger auth-alert" style="display:none" role="alert">
          <span id="login-error-msg"></span>
        </div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="field auth-field">
            <label for="input-username">Username</label>
            <div class="auth-input-wrap"><span class="auth-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0"/></svg></span><input id="input-username" type="text" name="username" placeholder="Masukkan username" autocomplete="username" minlength="4" required/></div>
          </div>
          <div class="field auth-field">
            <label for="input-password">Password</label>
            <div class="auth-input-wrap auth-password-wrap">
              <span class="auth-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
              <input id="input-password" type="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required/>
              <button type="button" id="btn-toggle-password" class="password-toggle" aria-label="Tampilkan password"><svg class="eye-icon" viewBox="0 0 24 24" focusable="false"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
            </div>
          </div>

          <div class="auth-form-row auth-form-row-clean">
            <button type="button" id="btn-lupa-password" class="auth-link-btn">Lupa password?</button>
          </div>

          <button id="btn-login" type="submit" class="btn btn-primary btn-block auth-main-btn">Login</button>
        </form>

        <div class="auth-switch-card">
          <div><strong>Belum punya akun?</strong></div>
          <a href="pendaftaran.html">Daftar</a>
        </div>

        <a href="index.html" class="auth-home-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M10 6l-6 6 6 6"/></svg><span>Kembali ke halaman utama</span></a>
      </div>
    </section>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/core/auth.js?v=1.1.59"></script>
  <script src="js/core/activity.js?v=1.1.59"></script>
  <script src="js/login/login.js?v=1.1.59"></script>
  <script src="js/system/pwa-register.js"></script>
</body>
</html>
